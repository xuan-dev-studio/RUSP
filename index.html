// ---- 主题切换 ----
document.getElementById("themeToggle").addEventListener("click", () => {
  const root = document.documentElement;
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);

// ---- 示例数据（取自 示例文件.xlsx）----
const SAMPLE_OP = ["137****1234","132****5678","138****9999","138****9999"];
const SAMPLE_CLOUD = ["13700001234","13200015678","15000012910","13800019999","13800029999"];

function digitsOnly(s){ return String(s).replace(/\D/g, ""); }

// 从运营商文本解析出 前3位 + 后4位 特征
function parseOp(s){
  s = String(s).trim();
  const star = s.indexOf("*");
  if (star >= 0){
    // 含 * 的模糊号：按「前3位 + 后4位」匹配
    const prefix = s.substring(0, star).replace(/\D/g, "");
    const after = s.substring(s.lastIndexOf("*")+1).replace(/\D/g, "");
    return { prefix, suffix: after, raw: s, masked: true, full: null };
  }
  const d = digitsOnly(s);
  // 完整号码：需做精确匹配（保留完整数字串）
  if (d.length >= 7) return { prefix: d.substring(0,3), suffix: d.substring(d.length-4), raw: s, masked: false, full: d };
  return null; // 无法解析
}

function readLines(text){
  return text.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
}

function analyze(){
  const opLines = readLines(document.getElementById("opInput").value);
  const cloudLines = readLines(document.getElementById("cloudInput").value);

  // 二代云号码列表（保留原始与纯数字），并预计算索引键 前3|后4
  const clouds = cloudLines.map(raw => {
    const d = digitsOnly(raw);
    const pkey = d.length >= 7 ? d.substring(0, 3) + "|" + d.substring(d.length - 4) : null;
    return { raw, d, pkey };
  });

  // 建立索引：pkey -> 匹配的二代云号码，将 O(运营商×二代云) 降为 O(运营商+二代云)
  const cloudIndex = new Map();
  clouds.forEach(c => {
    if (!c.pkey) return;
    if (!cloudIndex.has(c.pkey)) cloudIndex.set(c.pkey, []);
    cloudIndex.get(c.pkey).push(c);
  });

  const results = [];
  const matchedCloudSet = new Set(); // 记录被运营商号匹配到的二代云号

  // 1) 运营商号驱动的行
  opLines.forEach(opRaw => {
    const p = parseOp(opRaw);
    if (!p){ return; } // 跳过无法解析（如空行/NaN）
    if (p.prefix.length < 3 || p.suffix.length < 4){
      results.push({ type: "op", op: opRaw, matches: [], status: "bad", reason: "格式无法识别" });
      return;
    }
    const candidates = cloudIndex.get(p.prefix + "|" + p.suffix) || [];
    // 模糊号（含*）：前3+后4匹配；完整号：需与二代云号完全一致（精确匹配）
    const matches = p.masked ? candidates : candidates.filter(c => c.d === p.full);
    matches.forEach(m => matchedCloudSet.add(m));
    const middles = matches.map(m => m.d.substring(3, m.d.length - 4));
    const middleDiffers = new Set(middles).size > 1;

    let status, reason;
    if (matches.length === 0){
      status = "bad";
      // 完整号但候选里有前3+后4相同却中间不同的号码，给出更明确的说明
      reason = (!p.masked && candidates.length > 0) ? "二代云中无精确匹配（存在前3+后4相同但中间不同的号码）" : (p.masked ? "二代云中无匹配" : "二代云中无精确匹配");
    } else if (matches.length === 1){
      status = "ok"; reason = p.masked ? "唯一匹配" : "精确匹配";
    } else {
      status = "warn";
      reason = middleDiffers ? ("多重匹配，中间4位不同(" + middles.join("/") + ")") : "多重匹配(中间4位相同)";
    }
    results.push({ type: "op", op: opRaw, matches, status, reason, middles, middleDiffers });
  });

  // 2) 仅存在于二代云、运营商无匹配的行
  const validCloud = clouds.filter(c => c.pkey).length;
  clouds.forEach(c => {
    if (!c.pkey) return;
    if (!matchedCloudSet.has(c)){
      results.push({ type: "cloud", op: "—", cloud: c, status: "info", reason: "仅存在于二代云（运营商中无匹配）" });
    }
  });

  lastResults = results;
  lastValidCloud = validCloud || 0;
  render();
}

let lastResults = null;
let lastValidCloud = 0;
let searchTerm = "";
const PAGE_SIZE = 50;
let currentPage = 1;
function exportExcel(){
  if (!lastResults || !lastResults.length){
    alert("请先点击「分析结果」生成数据后再导出。");
    return;
  }
  const rows = [["运营商导出号", "二代云匹配号", "匹配结果", "说明"]];
  lastResults.forEach(r => {
    let op, matchStr, label;
    if (r.type === "cloud"){
      op = "—";
      matchStr = r.cloud.raw;
      label = "仅二代云";
    } else {
      op = r.op;
      matchStr = r.matches.length ? r.matches.map(m => m.raw).join(", ") : "";
      label = r.status === "ok" ? "匹配" : (r.status === "warn" ? "匹配(多重)" : "未匹配");
    }
    rows.push([op, matchStr, label, r.reason || ""]);
  });

  if (typeof XLSX !== "undefined"){
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 16 }, { wch: 30 }, { wch: 14 }, { wch: 30 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "匹配结果");
    XLSX.writeFile(wb, "匹配结果.xlsx");
  } else {
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "匹配结果.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }
}

// 判断某行是否匹配搜索关键词（运营商号 / 二代云号 / 说明）
function rowMatches(r, term){
  const hay = [String(r.op), String(r.reason || "")];
  if (r.type === "cloud"){
    hay.push(String(r.cloud.raw));
  } else {
    (r.matches || []).forEach(m => hay.push(String(m.raw)));
  }
  return hay.join("\n").toLowerCase().indexOf(term) !== -1;
}

function applySearch(){
  searchTerm = document.getElementById("searchInput").value || "";
  render();
}

// keepPage=true 时保留当前页码（用于翻页）；否则回到第 1 页（用于新分析/新搜索）
function render(keepPage){
  const card = document.getElementById("resultCard");
  card.style.display = "block";

  const all = lastResults || [];

  // 统计（基于全量分析结果，不受搜索影响）
  const opRows = all.filter(r => r.type === "op");
  const cloudRows = all.filter(r => r.type === "cloud");
  const ok = opRows.filter(r => r.status === "ok").length;
  const warn = opRows.filter(r => r.status === "warn").length;
  const bad = opRows.filter(r => r.status === "bad").length;
  const matchedCloud = (lastValidCloud || 0) - cloudRows.length;

  // 搜索过滤
  const term = searchTerm.trim().toLowerCase();
  const display = term ? all.filter(r => rowMatches(r, term)) : all;

  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${opRows.length}</b>运营商号</div>` +
    `<div class="stat"><b style="color:var(--ok)">${ok}</b>唯一匹配</div>` +
    `<div class="stat"><b style="color:var(--warn)">${warn}</b>多重匹配</div>` +
    `<div class="stat"><b style="color:var(--bad)">${bad}</b>运营商未匹配</div>` +
    `<div class="stat"><b>${lastValidCloud || 0}</b>二代云总数</div>` +
    `<div class="stat"><b style="color:var(--ok)">${matchedCloud}</b>二代云已匹配</div>` +
    `<div class="stat"><b style="color:var(--primary)">${cloudRows.length}</b>仅二代云</div>`;

  const searchCount = document.getElementById("searchCount");
  searchCount.textContent = term ? `搜索「${searchTerm.trim()}」：${display.length} / ${all.length} 条` : "";

  const body = document.getElementById("resultBody");
  body.innerHTML = "";
  if (all.length === 0){
    body.innerHTML = `<tr><td colspan="4" class="empty">暂无数据，请先输入运营商与二代云账号</td></tr>`;
    document.getElementById("orphanBox").innerHTML = "";
    document.getElementById("pager").style.display = "none";
    return;
  }
  if (display.length === 0){
    body.innerHTML = `<tr><td colspan="4" class="empty">未找到与「${searchTerm.trim()}」匹配的结果</td></tr>`;
    document.getElementById("orphanBox").innerHTML = "";
    document.getElementById("pager").style.display = "none";
    return;
  }

  // 分页：仅渲染当前页的数据
  const total = display.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (!keepPage) currentPage = 1;
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const pageRows = display.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  pageRows.forEach(r => {
    const tr = document.createElement("tr");
    // 运营商号
    const tdOp = document.createElement("td");
    tdOp.textContent = r.op;
    // 二代云匹配号
    const tdMatch = document.createElement("td");
    tdMatch.className = "match-list";
    if (r.type === "cloud"){
      tdMatch.innerHTML = `${r.cloud.raw} <span class="mid">[中:${r.cloud.d.substring(3, r.cloud.d.length - 4)}]</span>`;
    } else if (r.matches.length === 0){
      tdMatch.innerHTML = `<span class="note">— 无 —</span>`;
    } else {
      tdMatch.innerHTML = r.matches.map((m,i) =>
        `${m.raw} <span class="mid">[中:${r.middles[i]}]</span>`
      ).join("<br>");
    }
    // 匹配结果
    const tdRes = document.createElement("td");
    let cls = r.status === "ok" ? "ok" : (r.status === "warn" ? "warn" : (r.status === "info" ? "info" : "bad"));
    let label = r.status === "ok" ? "匹配" : (r.status === "warn" ? "匹配(多重)" : (r.status === "info" ? "仅二代云" : "未匹配"));
    tdRes.innerHTML = `<span class="tag ${cls}">${label}</span>`;
    // 说明
    const tdNote = document.createElement("td");
    tdNote.className = "note";
    tdNote.textContent = r.reason || "";
    tr.append(tdOp, tdMatch, tdRes, tdNote);
    body.appendChild(tr);
  });

  document.getElementById("orphanBox").innerHTML = "";
  renderPager(total, totalPages);
}

function renderPager(total, totalPages){
  const pager = document.getElementById("pager");
  if (totalPages <= 1){
    pager.style.display = "none";
    return;
  }
  pager.style.display = "flex";

  let html = `<button class="pager-btn" data-page="${currentPage - 1}" ${currentPage === 1 ? "disabled" : ""}>上一页</button>`;

  const nums = [];
  const win = 2;
  for (let p = 1; p <= totalPages; p++){
    if (p === 1 || p === totalPages || (p >= currentPage - win && p <= currentPage + win)) nums.push(p);
  }
  let prev = 0;
  nums.forEach(p => {
    if (p - prev > 1) html += `<span class="pager-ellipsis">…</span>`;
    html += `<button class="pager-btn ${p === currentPage ? "active" : ""}" data-page="${p}">${p}</button>`;
    prev = p;
  });

  html += `<button class="pager-btn" data-page="${currentPage + 1}" ${currentPage === totalPages ? "disabled" : ""}>下一页</button>`;
  html += `<span class="pager-info">第 ${currentPage}/${totalPages} 页 · 共 ${total} 条（每页 ${PAGE_SIZE} 条）</span>`;
  pager.innerHTML = html;
}

document.getElementById("analyzeBtn").addEventListener("click", () => {

  setTimeout(() => {

});

  const p = parseInt(btn.dataset.page, 10);

// 单列粘贴：若某行包含 tab，则拆成两列
document.getElementById("opInput").addEventListener("paste", e => {
  setTimeout(() => splitPaste("opInput", "cloudInput"), 0);
});
function splitPaste(opId, cloudId){
  const op = document.getElementById(opId);
  const cloud = document.getElementById(cloudId);
  const lines = op.value.split(/\r?\n/);
  if (!lines.some(l => l.includes("\t"))) return;
  const ops = [], cl = [];
  lines.forEach(l => {
    const parts = l.split("\t");
    ops.push(parts[0] || "");
    if (parts[1] !== undefined) cl.push(parts[1]);
  });
  op.value = ops.join("\n");
  cloud.value = cl.join("\n");
}

// ---- xlsx 上传（优先用 SheetJS CDN，失败则提示粘贴）----
document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      if (typeof XLSX === "undefined"){
        throw new Error("SheetJS 未加载，请改用粘贴方式输入数据。");
      }
      const wb = XLSX.read(ev.target.result, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
      const OP_HEADER = "运营商导出用户账号";
      const CLOUD_HEADER = "寰创二代云导出用户账号";
      const ops = [], cl = [];
      rows.forEach(r => {
        const a = r[0] !== undefined ? String(r[0]).trim() : "";
        const b = r[1] !== undefined ? String(r[1]).trim() : "";
        if (a && a !== OP_HEADER) ops.push(a);
        if (b && b !== CLOUD_HEADER) cl.push(b);
      });
      document.getElementById("opInput").value = ops.join("\n");
      document.getElementById("cloudInput").value = cl.join("\n");
    } catch(err){
      alert("读取失败：" + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
});
